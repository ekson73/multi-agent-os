schema: 1
id: vscode
name: Visual Studio Code
vendor: Microsoft
kind: ide
detect:
  commands:
  - code
  paths:
  - ~/Library/Application Support/Code/User
  - ~/.config/Code/User
mcp:
  supported: true
  config_paths:
  - path: ~/Library/Application Support/Code/User/mcp.json
    scope: user
    platform: darwin
  - path: ~/.config/Code/User/mcp.json
    scope: user
    platform: linux
  - path: ./.vscode/mcp.json
    scope: workspace
  format: jsonc
  key_path:
  - servers
  entry_style: vscode-servers
  transports:
  - stdio
  - http
  - sse
  supports:
    headers: true
    env: true
    disable: false
    disable_field: null
    disable_semantics: null
  cli:
    add: code --add-mcp '{"name":"<n>","type":"http","url":"<u>"}'
    list: null
    remove: null
extensions:
  skills: null
  plugins: extensions (code --install-extension)
  marketplace: null
update:
  version_cmd: code --version
  update_cmd: in-app auto-update
docs_url: https://code.visualstudio.com/docs/copilot/customization/mcp-servers
last_verified: '2026-09-24'
confidence: high
skip_reason: null
notes: 'Map key `servers` (not mcpServers); top-level `inputs` array holds promptString inputs referenced as ${input:id} —
  preferred way to avoid literal secrets. Remote: {type: http|sse, url, headers}; stdio: {type: stdio, command, args, env,
  envFile?}. No per-entry disable (UI). Format is JSONC tolerant; current file is plain JSON. 18 entries observed; some carry
  gallery/version (from MCP gallery) — preserve.'
