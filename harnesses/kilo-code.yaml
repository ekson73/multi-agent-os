schema: 1
id: kilo-code
name: Kilo Code (VS Code extension)
vendor: Kilo Code
kind: extension
detect:
  commands: []
  paths:
  - ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code
mcp:
  supported: true
  config_paths:
  - path: ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code/settings/mcp_settings.json
    scope: user
  - path: ./.kilocode/mcp.json
    scope: project
  format: json
  key_path:
  - mcpServers
  entry_style: mcpservers-json
  entry_overrides:
    type_values: {streamable-http: streamable-http}
  transports:
  - stdio
  - sse
  - streamable-http
  supports:
    headers: true
    env: true
    disable: true
    disable_field: disabled
    disable_semantics: disabled-bool
  cli: null
extensions:
  skills: null
  plugins: null
  marketplace: null
update:
  version_cmd: null
  update_cmd: VS Code extension auto-update
docs_url: https://kilocode.ai/docs/features/mcp/using-mcp-in-kilo-code
last_verified: '2026-09-24'
confidence: medium
skip_reason: null
notes: Additional installed harness (Roo fork). Observed 9 stdio entries {command,args,env,disabled,alwaysAllow}. Remote shape
  docs-only.
