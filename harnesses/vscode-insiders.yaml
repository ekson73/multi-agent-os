schema: 1
id: vscode-insiders
name: Visual Studio Code - Insiders
vendor: Microsoft
kind: ide
detect:
  commands:
  - code-insiders
  paths:
  - ~/Library/Application Support/Code - Insiders/User
  - ~/.config/Code - Insiders/User
mcp:
  supported: true
  config_paths:
  - path: ~/Library/Application Support/Code - Insiders/User/mcp.json
    scope: user
    platform: darwin
  - path: ~/.config/Code - Insiders/User/mcp.json
    scope: user
    platform: linux
  - path: ./.vscode/mcp.json
    scope: workspace
  format: jsonc
  key_path:
  - servers
  entry_style: vscode-servers
  transports:
  - stdio
  - http
  - sse
  supports:
    headers: true
    env: true
    disable: false
    disable_field: null
    disable_semantics: null
  cli:
    add: null
    list: null
    remove: null
extensions:
  skills: null
  plugins: extensions (code --install-extension)
  marketplace: null
update:
  version_cmd: null
  update_cmd: in-app auto-update
docs_url: https://code.visualstudio.com/docs/copilot/customization/mcp-servers
last_verified: '2026-09-24'
confidence: high
skip_reason: null
notes: 'Map key `servers` (not mcpServers); top-level `inputs` array holds promptString inputs referenced as ${input:id} —
  preferred way to avoid literal secrets. Remote: {type: http|sse, url, headers}; stdio: {type: stdio, command, args, env,
  envFile?}. No per-entry disable (UI). Format is JSONC tolerant; current file is plain JSON. 6 entries observed (gallery/version
  fields).'
