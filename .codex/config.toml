#:schema https://developers.openai.com/codex/config-schema.json

# ECC Tools generated Codex baseline
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

# Distinct name on purpose: Codex merges project and user config per key, so a
# project `context7` entry collides with any user-scope `context7` entry of the
# other transport ("url is not supported for stdio"), whether this one is stdio
# or remote. Keyless remote baseline; a user's own `context7` entry (any
# transport, with or without an API key header) keeps working alongside it.
# This entry inherits neither headers nor `enabled` from a user `context7`; to turn
# it off, add these two lines to ~/.codex/config.toml:
#   [mcp_servers.context7_baseline]
#   enabled = false
[mcp_servers.context7_baseline]
url = "https://mcp.context7.com/mcp"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--extension"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"