# Canonical participants whitelist
#
# Schema: each entry has {canonical_name, aliases, contexts, source}
# - canonical_name: the correct, full spelling
# - aliases: known shortenings / nicknames (case-preserved)
# - contexts: tags identifying meetings/orgs where this person appears
# - source: where this entry was confirmed (operator directive | Invitees block | etc)
#
# Shipped entries are synthetic pseudonyms (P1, P2, P3, ...). A real roster
# belongs in a local overlay, not in this public catalog.
#
# Version: 1.1.0 (2026-10-22)
# Cross-vendor AAIF: language-neutral, format-stable YAML

schema_version: 1.0.0
updated: "2026-10-22"

participants:
  # ---- Synthetic roster (public fixture) ----

  - canonical_name: "P1"
    aliases:
      - "P1"
    contexts:
      - synthetic-daily
    source: "synthetic roster"

  - canonical_name: "P2"
    aliases:
      - "P2"
    contexts:
      - synthetic-daily
    source: "synthetic roster"
    notes: |
      ASR-prone label in the shipped example. The phonetic catalog maps the
      synthetic mishearing "Ptwo" to "P2" when P2 is also on the invitee list.

  - canonical_name: "P3"
    aliases:
