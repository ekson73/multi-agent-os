# .gitleaks.toml -- Gitleaks configuration for MAOS-based repositories
# Canonical source: multi-agent-os/.gitleaks.toml
# Version: 1.5.0

title = "MAOS Secret Scanning Rules"

[extend]
# Built-in gitleaks rules (github-pat, aws-access-token, …) are part of the gate.
useDefault = true

[[rules]]
id = "app-db-password"
description = "Hardcoded database password"
# secretGroup = 1 points entropy + the reported Secret at the VALUE (capture
# group 1), not the whole `name=value` match. entropy = 2.0 is a low floor that
# drops only pure-repeat junk (xxxxxxxx = 0.0) while KEEPING weak human
# passwords (changeme/Passw0rd = 2.750). The old `entropy = 3.5` on the whole
# match silently skipped every weak credential — see tests/test-gitleaks-config.sh
# (RECALL cases) and the Approach C-hardened decision record.
#
# The value char class excludes shell/template/code punctuation ($ { } ( ) , .)
# so the rule matches a literal `KEY=secret` but NOT code references it used to
# false-positive on: os.getenv(, os.getcwd(), ${DB_PASS}, $deploy_password.
# Excluding '.' drops dotted-identifier code calls (os.getenv) at the cost of
# not matching a password that itself contains a dot — an accepted trade: the
# rule still catches dot-free weak creds, and every code-reference FP vanishes.
regex = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*['"]?([^\s'"$\{\}(),.]{8,})['"]?'''
keywords = ["password", "passwd", "pwd"]
secretGroup = 1
# No entropy floor. Recall lives on the rule, precision on the allowlist. An
# entropy floor is a false-negative in disguise: a low floor (2.0) still drops
# non-repeat weak secrets like `abababab` (Shannon 1.0) while — measured on this
# repo's full history — removing it adds ZERO false positives, because the value
# char-class already excludes code/template metachars ('. $ { } ( ) ,'). Weak,
# documented placeholders are suppressed by the narrow allowlist below, never by
# an entropy cutoff that cannot tell a placeholder from a weak real credential.

# Rule-scoped false-positive exemptions (NOT global — must never weaken other
# rules). Each is form- or path-anchored and deliberately narrow. NOTE: we do
# NOT path-allowlist docs/insights/ broadly — secret-management-strategy.md
# holds a REAL credential that MUST keep firing until it is rotated.
[rules.allowlist]
description = "app-db-password documented non-credential references"
# regexTarget=secret: test the EXTRACTED VALUE (secretGroup 1), fully anchored
# ^…$ so the WHOLE value must BE an AWS Secrets Manager REFERENCE URI (the
# pointer, not a secret) — e.g. aws:///example-app/env/hml#APP_DB_PASSWORD. Testing
# the match (unanchored) was unsafe: a real password merely ENDING in such a URI
# (CorrectHorse1!aws:///foo#BAR) contained the substring and was suppressed.
regexTarget = "secret"
regexes = [
    '''^aws:///[^\s'"]+#[A-Z0-9_]+$''',
    # Whole value is exactly the redaction mask <REDACTED>, the only
    # angle-bracket placeholder in this repo's history. The value class allows
    # < and >, so without this exemption the gate flags the mask itself.
    # Exact literal, fully anchored ^…$ on the extracted value: any other
    # bracketed value (<s3cr3t!x>, <A1234567>) still fires. Only the
    # placeholder is exempt, never the rule or a path.
    '''^<REDACTED>$''',
]
# Path exemptions: a CI build-log capture and a test fixture — neither is a
# credential store. Anchored to the EXACT file end-of-path ($) so a suffixed
# sibling (…step1010_logs.txt.bak) is NOT exempted and stays scanned.
paths = [
    '''(^|/)mcp-tools/maos-mcp-hub/step1010_logs\.txt$''',
    '''(^|/)skills/verified-agentic-session-model/tests/model-bundle\.test\.mjs$''',
]

[[rules]]
id = "app-quarkus-datasource-password"
description = "Quarkus datasource password in properties"
regex = '''quarkus\.datasource\..*password\s*[:=]\s*[^\s$\{]{4,}'''
keywords = ["quarkus.datasource"]

[[rules]]
id = "app-spring-datasource-password"
description = "Spring datasource password in properties"
regex = '''spring\.datasource\.password\s*[:=]\s*[^\s$\{]{4,}'''
keywords = ["spring.datasource.password"]

[[rules]]
id = "app-jwt-secret"
description = "JWT secret or signing key"
# secretGroup = 1 → the reported Secret is the VALUE, not the whole match. No
# entropy floor (see app-db-password rationale): an entropy cutoff cannot
# separate a weak placeholder from a weak real secret, so it only hides
# low-entropy credentials. Old `entropy = 3.0` on the whole match under-detected.
# See tests/test-gitleaks-config.sh.
regex = '''(?i)(?:jwt[._-]?secret|signing[._-]?key)\s*[:=]\s*['"]?([^\s'"$\{]{16,})['"]?'''
keywords = ["jwt", "signing"]
secretGroup = 1

[[rules]]
id = "app-bitbucket-app-password"
description = "Bitbucket app password"
regex = '''(?i)(bitbucket[._-]?(?:app[._-]?)?password|BB_AUTH_STRING)\s*[:=]\s*['"]?[^\s'"$\{]{8,}['"]?'''
keywords = ["bitbucket", "BB_AUTH"]

[[rules]]
id = "app-uri-userinfo-password"
description = "Password embedded in a URI userinfo (scheme://user:pass@host or scheme://:pass@host)"
# secretGroup = 1 → the reported Secret is the password, not the whole URI.
# A colon before the password is required, so a user-only userinfo
# (scheme://***@host) is not a match. Case-insensitivity is scoped to the
# scheme. No entropy floor: Shannon entropy of n characters is at most
# log2(n), so a floor of 3.5 never matches a value shorter than 12 characters.
# '$', '*', '.', ',', parentheses and brackets may appear inside the password.
# The capture ends at '@' and does not stop on '#'. Masks are whole-value
# allowlist regexes below — never a path exemption, and never a substring
# stopword (a stopword would also hide a real secret that merely contains
# the word).
regex = '''(?i:[a-z][a-z0-9+.-]*)://[^/\s:@]*:([^:@\s'"]{8,})@'''
keywords = ["://"]
secretGroup = 1

[rules.allowlist]
description = "app-uri-userinfo-password masks and placeholders (value, not path)"
regexTarget = "secret"
regexes = [
    # (?i:...) keeps the flag inside this alternative. An unscoped (?i) leaks
    # into later alternatives when gitleaks joins the list with OR.
    '''^(?i:changeme|example)$''',
    '''^\*+$''',
    '''^<[^>\s]*>$''',
    '''^\$\{[^}]+\}$''',
]

[[rules]]
id = "app-password-assignment"
description = "password/passwd/pwd/secret assignment in properties, env, yaml, or ini"
# The key is a bare word or dot/underscore/hyphen-separated segments ending in
# password|passwd|pwd|secret (DB_PASSWORD, app.secret, pwd). Case-insensitivity
# is scoped to that key. A ':' assignment requires whitespace after the colon
# (yaml `key: value`); a glued `key:value` is not an assignment. '=' allows
# optional space (properties, env, ini).
# secretGroup = 2 is the value. No entropy floor (same reason as the URI rule):
# a value of 8–11 characters must still fire. The value may contain '$', '*',
# '.' and ','. '(' ends the value so a call such as os.getenv( is not swallowed
# into the secret; os.getenv itself is an exact allowlist entry below.
# Placeholders are exact anchored regexes on the extracted value. This rule
# does NOT path-allowlist docs/insights/secret-management-strategy.md.
regex = '''(?:^|[^A-Za-z0-9])["']?((?i:(?:[A-Za-z0-9]+[._-])*(?:password|passwd|pwd|secret)))["']?\s*(?:=[ \t]*|:[ \t]+)["']?([^(\s'"]{8,})'''
keywords = ["password", "passwd", "pwd", "secret"]
secretGroup = 2

[rules.allowlist]
description = "app-password-assignment masks, placeholders, reference URIs, code constants"
regexTarget = "secret"
regexes = [
    '''^(?i:changeme|example)$''',
    '''^\*+$''',
    # Angle-bracket placeholder: only the exact mask <REDACTED> (the single
    # bracketed form in this repo's history), never any bracketed value.
    '''^<REDACTED>$''',
    '''^\$\{[^}]+\}$''',
    # Whole value is an AWS Secrets Manager reference, same anchor as
    # app-db-password. A real password that merely contains this text is not
    # this pattern and still fires. '#' stays inside the value so this anchor
    # sees the field name.
    '''^aws:///[^\s'"]+#[A-Z0-9_]+$''',
    # Case-sensitive and exact. (?-i) holds even if an earlier alternative
    # in the joined OR-list turned case-folding on. A lowercase or mixed-case
    # alphanumeric secret must NOT match. At least one '_' segment is required
    # (identifier shape, SOME_CONSTANT_NAME), so a bare all-caps literal such
    # as ABABABAB or PASSW0RD still fires.
    '''(?-i)^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$''',
    # Code reference: UPPER_CONSTANT.attr (SECRET_PARAM_RE.match), not a credential.
    '''(?-i)^[A-Z][A-Z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+$''',
    # password = os.getenv("NAME") — the call parenthesis is not part of the value.
    '''^os\.getenv$''',
    # Code references, not literals: bare shell expansion ($APP_SECRET_VALUE),
    # os.environ["X"] / os.environ.get("X") (value stops at the quote or '('),
    # process.env.X, and member access on self/request/settings/config.
    '''^\$[A-Za-z_][A-Za-z0-9_]*$''',
    '''^os\.environ(?:\.get)?\[?$''',
    '''^process\.env\.[A-Za-z_][A-Za-z0-9_]*$''',
    '''^(?:self|request|settings|config)\.[A-Za-z_][A-Za-z0-9_.]*\[?$''',
]

[[rules]]
id = "app-env-default-secret"
description = "Non-empty default in ${VAR:default} or ${VAR:-default} when VAR names a password, secret, key, or token"
# Both the properties form ${VAR:default} and the shell form ${VAR:-default}.
# The shell '-' is the operator, not part of the secret. VAR must contain a
# whole segment password|passwd|pwd|secret|key|token (API_KEY matches;
# KEYBOARD does not). secretGroup = 2 is the default. A '$' may appear in the
# default, but '${' does not, so a nested ${OTHER} is not a literal secret.
# Empty, ***, <REDACTED>, <...>, ${OTHER_VAR}, changeme, and example do not
# match. No path allowlist. No entropy floor.
regex = '''\$\{((?i:(?:[A-Za-z0-9]+[._-])*(?:password|passwd|pwd|secret|key|token)(?:[._-][A-Za-z0-9]+)*)):-?((?:[^\s'"$\{\}()<>]|[$][^{]){8,})\}'''
keywords = ["password", "passwd", "pwd", "secret", "key", "token"]
secretGroup = 2

[rules.allowlist]
description = "app-env-default-secret masks and placeholders (value, not path)"
regexTarget = "secret"
regexes = [
    '''^(?i:changeme|example)$''',
    '''^\*+$''',
    '''^<[^>\s]*>$''',
    '''^\$\{[^}]+\}$''',
]

[allowlist]
description = "Global allowlist"

# Documentation placeholders are not credentials.
#
# WHY regexTarget = "line" (not the default, and not "match"): the allowlist
# regex is tested against the ENTIRE source line, so it can be anchored `^…$`.
# Anchoring the match target instead would be unsafe — a rule's match can
# truncate at a quote (`=your_app_password'REALSECRET'`), leaving the real
# secret outside the match while a `$`-anchored exemption still fires. Testing
# the whole line means any trailing content (glued, quoted, or after a colon)
# breaks the `$` and the credential stays detectable.
#
# SCOPE (deliberately narrow): only the exact documented Bitbucket app-password
# placeholder lines in mcp-tools/maos-mcp-hub docs — bare `KEY=value`, JSON
# `"KEY": "value",`, and commented `# KEY=value_here` forms — where the whole
# value is the literal `your_app_password` / `your_app_password_here`. A real
# credential (any other value, or extra trailing content) is NOT allowlisted
# and still fails the gate.
regexTarget = "line"
regexes = [
    '''(?i)^\s*(?:#\s*)?["']?[a-z0-9_.]*bitbucket[a-z0-9_.]*password["']?\s*[:=]\s*["']?your_app_password(?:_here)?["']?,?\s*$''',
]

paths = [
    '''target/''',
    '''dist/''',
    '''node_modules/''',
    '''\.worktrees/''',
    '''\.git/''',
    '''\.angular/''',
    '''build/''',
    '''\.auto-claude/''',
    '''\.sessions/''',
    '''tmux-server-.*\.log''',
    '''\.qoder/''',
    # The gitleaks config's OWN test harness — intentional credential-shaped
    # fixtures (changeme, Passw0rd, your_app_password) that exercise the rules.
    # Anchored to the exact file end-of-path ($) so a suffixed sibling
    # (test-gitleaks-config.sh.bak) is NOT exempted and stays scanned.
    '''(^|/)tests/test-gitleaks-config\.sh$''',
]
