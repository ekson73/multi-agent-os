# Version Sync Check
# SSOT: .claude-plugin/plugin.json
# Checked: README.md, CLAUDE.md, package.json, packaging/opencode-maos/package.json
#
# main is protected (PR-only + required checks), so this workflow never pushes.
# It compares the version VALUES (not file bytes) and fails with the fix command.
# Fix locally on a branch and open a PR:  scripts/sync-version.sh

name: Version Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Check versions match plugin.json
        run: scripts/sync-version.sh --check
