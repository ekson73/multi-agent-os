# Require a CHANGELOG entry when a PR changes the consumable contract.
#
# Closes the drift documented in #278: skills ship without a CHANGELOG entry, so
# `[Unreleased]` under-reports what the plugin actually delivers — and whoever reads
# it to size a release bump sees less than exists. Measured on the last 25 merged PRs:
# 13 touch skills/agents/commands, 11 carry no entry (84%).
#
# Design, from measurement rather than assumption (see #348):
#
#   1. CLASSIFICATION is delegated to scripts/entry-classifier.sh — the SAME predicate
#      tests/validate-plugin.sh uses. A path regex cannot express this rule: it needs
#      filesystem state (does an ancestor hold a SKILL.md?). The first draft of this
#      workflow tried a regex and measurably missed 30 nested entries
#      (agents/consultants/*, commands/*/*) while flagging 4 ALL-CAPS documents
#      (agents/README.md, agents/COWORK-AUTONOMY-POLICY.md, ...). One predicate, two
#      consumers, no second copy to drift.
#
#   2. MODE = WARN first, BLOCK on evidence (`ai-as-pwd-axiom` §4: "start with
#      reinforcement, promote to BLOCK only after evidence"). At the measured baseline a
#      hard fail would have blocked 8 of the last 13 PRs and made `no-changelog` the
#      default — a gate defeated by its own escape. Flip ENFORCE to '1' to promote.
#
# Security posture matches release-coherence.yml: the classifier comes from a TRUSTED
# checkout of `main`; the PR head is never checked out or executed, only its file LIST
# is read from the API.

name: changelog-required

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` matter: the escape is a label, so applying or removing it must
    # re-evaluate the gate. Without them the verdict goes stale until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-required:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require a CHANGELOG entry when the consumable contract changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # WARN (0) -> BLOCK (1). Promotion is an operator decision; see the header.
          ENFORCE: '0'
        run: |
          set -euo pipefail

          # --- explicit, logged escape -------------------------------------------------
          # A skipped job reads as "not run"; an early exit that says why reads as a
          # decision. #278 asks for the escape to be explicit and logged, not silent.
          case ",${PR_LABELS}," in
            *,no-changelog,*)
              echo "::notice::escape label 'no-changelog' present — gate waived for this PR"
              exit 0
              ;;
          esac

          # --- read the diff without touching head code --------------------------------
          # Guarded: under `set -e` an unguarded $( ) would abort the job on a transient
          # API failure, before the emptiness check below could degrade gracefully.
          files=''
          api_rc=0
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')" || api_rc=$?

          if [ "${api_rc}" -ne 0 ] || [ -z "${files}" ]; then
            # Could not read the diff => the gate is UNVERIFIED, which is not the same as clean.
            if [ "${ENFORCE}" = '1' ]; then
              echo "::error::could not read the changed-file list (gh api rc=${api_rc}) — failing closed in BLOCK mode"
              exit 1
            fi
            echo "::warning::could not read the changed-file list (gh api rc=${api_rc}) — gate UNVERIFIED, not clean"
            exit 0
          fi

          # --- bootstrap: the classifier must pre-exist on the TRUSTED base -------------
          # Structural to this pattern, not a bug: the checker runs from `main`, so the PR
          # that INTRODUCES it cannot exercise it — main does not have it yet. Absence is a
          # third state, distinct from both "clean" and "violation", and it is named as such.
          # (Once this PR lands, main carries the script and the branch never fires again.
          #  If it ever fires afterwards it means the checker was deleted from main — which
          #  BLOCK mode must refuse to treat as a pass.)
          if [ ! -f scripts/changelog-required-check.sh ]; then
            if [ "${ENFORCE}" = '1' ]; then
              echo "::error::classifier absent from the trusted base — failing closed in BLOCK mode"
              exit 1
            fi
            echo "::warning::classifier not yet on main (bootstrap) — gate UNVERIFIED, not clean"
            exit 0
          fi

          # --- classify with the repo's own predicate ----------------------------------
          set +e
          verdict="$(printf '%s\n' "${files}" | bash scripts/changelog-required-check.sh)"
          check_rc=$?
          set -e

          echo "${verdict}"

          if [ "${check_rc}" -eq 0 ]; then
            exit 0
          fi
          if [ "${check_rc}" -ne 2 ]; then
            echo "::error::changelog-required-check.sh failed unexpectedly (rc=${check_rc})"
            exit 1
          fi

          # --- the finding -------------------------------------------------------------
          {
            echo "### changelog-required"
            echo
            echo "This PR changes the consumable contract but does not touch \`CHANGELOG.md\`."
            echo
            echo '```'
            echo "${verdict}"
            echo '```'
            echo
            echo "Add an entry under \`## [Unreleased]\`, or apply the \`no-changelog\` label"
            echo "if this genuinely changes nothing a consumer would notice."
          } >> "${GITHUB_STEP_SUMMARY}"

          msg="PR changes the consumable contract without a CHANGELOG.md entry (see the job summary; label 'no-changelog' to waive)"
          if [ "${ENFORCE}" = '1' ]; then
            echo "::error::${msg}"
            exit 1
          fi
          echo "::warning::${msg}"
          echo "gate is in WARN mode (ENFORCE=0) — not failing the PR"
