name: lens-dispatch tests

# tests/lens-dispatch-matrix.sh line 12 states: "It must run in CI or the claim must be
# deleted." This file is that promise kept. The SKILL.md cites the matrix as proof of its
# stated numbers; an uncited-because-unrun test is exactly the defect the red-team found in
# v0.1.0 (a matrix that existed only as something the author ran by hand in a terminal).
#
# jq is required by the golden pin and the table-size counters — it ships on ubuntu-latest.

# ⚠️ NO `paths:` filter, deliberately — diverging from the sibling workflows.
# A filter listing only the tool's own files is a BYPASS: `bin/lens-dispatch` shells out to
# `bin/dogfood-tally` at runtime (the confidence value) and the purity step runs
# `bin/check-layer-purity`. Editing either changes this tool's behaviour or its gate while
# the guard stays silent. Enumerating today's dependencies would only move the hole — the
# next dependency added re-opens it, and "remember to update the filter" is precisely the
# memory-dependent obligation `harmonic` L9 forbids.
# Cost of running it always: ~53s measured locally (macOS, 2026-07-22) — the suite makes
# ~170 CLI invocations and process-spawn dominates, so expect materially less on Linux CI.
# Not "~2s" as an earlier draft of this comment asserted without measuring; the number is
# stated because a cost claim used to justify a design choice has to be a measured one.
# A guard you can skip by editing a dependency is a guard with a bypass — the exact defect
# class this whole tool was repaired for. That trade is worth 53s.
on:
  pull_request:
  # Fork PRs skip layer-purity. The fork head is checked after merge, on push
  # to main, where LAYER_PURITY_PATTERNS is available and a missing variable
  # fails the job. workflow_dispatch re-runs a ref of this repo; it does not
  # run a fork head. A pre-merge check means checking that head out locally or
  # on a trusted branch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a superseded run when new commits land on the same PR/branch — no point burning a
  # full ~53s suite on a commit a newer push already obsoleted (coderabbit PR #279).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lens-dispatch:
    name: self-test + 44-combination matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned, matching supply-chain-sentinel.yml ("All third-party actions pinned").
        # The nearest sibling (converge-tests.yml) uses the mutable `@v7.0.0` tag — copying
        # it verbatim would have propagated that drift into a new file. Reuse the pattern,
        # not the deviation.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Don't persist the checkout token in .git/config — this job only reads the tree and
          # runs shell tests; it never pushes. OpenSSF Scorecard's dangling-credential check
          # flags a persisted token (why the Scorecard run was NEUTRAL) (coderabbit PR #279).
          persist-credentials: false

      - name: Assert jq is present
        # The golden pin parses JSON. Without jq the matrix would silently degrade to
        # comparing empty strings — a green suite that checks nothing.
        run: jq --version

      - name: Self-test (prints its own assertion count; exit 2 on failure)
        run: bash bin/lens-dispatch --self-test

      - name: Non-regression matrix + golden lens pin + table sizes
        run: bash tests/lens-dispatch-matrix.sh

  # Own job so a missing LAYER_PURITY_PATTERNS (this job stays red until the
  # owner creates that repository variable) cannot hide the other results.
  # No job dependency. Fork PRs skip inside the script; push to main does not.
  layer-purity:
    name: Layer Purity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Layer Purity (community promotion gate)
        # Org-specific patterns come from the LAYER_PURITY_PATTERNS repository variable
        # (newline-separated EREs), so the workflow never spells them; see bin/check-layer-purity.
        # An empty variable is not a silent pass: the script fails this step, except on a
        # pull request from a fork, where it emits ::warning:: and skips. That fork head
        # is checked after merge on push to main. workflow_dispatch does not run the
        # fork head; a pre-merge check is a local or trusted-branch checkout.
        env:
          MAOS_LAYER_PURITY_PATTERNS: ${{ vars.LAYER_PURITY_PATTERNS }}
        run: bash bin/check-layer-purity bin/lens-dispatch skills/lens-dispatch/SKILL.md tests/lens-dispatch-matrix.sh

  # Own job, no dependency on layer-purity, so a red purity check cannot skip this.
  validate-plugin:
    name: validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate plugin structure (repo MUST rule)
        # CLAUDE.md § MUST: "Validate plugin structure before committing." lens-dispatch adds a
        # bin/ tool + a skill; this asserts the manifest + skill/agent/command frontmatter still
        # pass the repo's own structural validator (coderabbit PR #279).
        run: bash tests/validate-plugin.sh
