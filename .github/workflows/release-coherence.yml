# Release Coherence Workflow (PR gate)
#
# The repository squash-merges PRs. A release therefore has to be represented
# by the PR artifact that survives on main, not merely by an ephemeral internal
# branch commit. When a PR changes the plugin version relative to its merge
# base, this gate requires a separate, release-only PR with:
#
# - a `chore(release): ...` PR title (the expected squash subject);
# - a monotonic SemVer advance over the current base;
# - linear history, so second-parent changes cannot hide provenance;
# - only manifest, changelog and derived version-documentation paths;
# - exactly one newly added CHANGELOG heading for that version; and
# - no reuse of a version already present in the base changelog or Git tags.
#
# A stale branch that never changes the version remains a no-op. plugin.json
# stays the SSOT; version-sync.yml continues syncing README/CLAUDE post-merge.

name: Release Coherence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-coherence:
    name: release-coherence
    runs-on: ubuntu-latest
    concurrency:
      group: release-coherence-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the squash-surviving release artifact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" >/dev/null 2>&1 || git fetch --no-tags --depth=50 origin "$BASE_SHA"

          # Execute the policy from the trusted base. The fallback exists only
          # for this workflow's bootstrap PR, before the checker reaches main.
          CHECKER="$RUNNER_TEMP/check-release-coherence.py"
          if git cat-file -e "$BASE_SHA:scripts/check-release-coherence.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-release-coherence.py" > "$CHECKER"
          else
            cp scripts/check-release-coherence.py "$CHECKER"
          fi

          python3 "$CHECKER" \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-title "$PR_TITLE"
