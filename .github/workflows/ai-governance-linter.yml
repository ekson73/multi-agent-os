name: GaaS Pipeline (AI Governance)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  governance-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checar Padrão de Nomenclatura do PR (C07)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            deps-dev
          requireScope: false
          
      - name: Validar Assinatura da IA Autônoma (Co-Authored-By)
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ ! "$PR_BODY" =~ "Co-Authored-By:" ]]; then
            echo "🛑 [GaaS Failure] O Pull Request carece de atestado de co-autoria da IA."
            echo "Adicione 'Co-Authored-By: <Nome-da-IA> <email-fake@ia.com>' na descrição do PR para compliance SOTA."
            # Uncomment the next line to strictly enforce and fail the action
            # exit 1
          else
            echo "✅ Assinatura de Agente validada."
          fi

      - name: Checkout (PII linter scope)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python (PII linter scope)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Acionar Linter de Segurança (PII) Local
        # Wires the placeholder slot declared in v1.0 of this workflow.
        # Implementation: skills/pii-masking/linter_pii.py (no external deps).
        # Closes OS3PD manifesto v4.13.0 Gap G1 (Principle 6 — Respect Wildlife).
        run: |
          set -euo pipefail
          python skills/pii-masking/linter_pii.py \
            --paths "**/*.py" \
            --paths "**/*.md" \
            --paths "**/*.yml" \
            --paths "**/*.yaml" \
            --paths "**/*.json" \
            --paths "**/*.sh" \
            --root . \
            --fail-on-match
