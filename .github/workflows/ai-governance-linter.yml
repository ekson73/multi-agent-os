name: GaaS Pipeline (AI Governance)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  governance-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checar Padrão de Nomenclatura do PR (C07)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          
      - name: Validar Assinatura da IA Autônoma (Co-Authored-By)
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ ! "$PR_BODY" =~ "Co-Authored-By:" ]]; then
            echo "🛑 [GaaS Failure] O Pull Request carece de atestado de co-autoria da IA."
            echo "Adicione 'Co-Authored-By: <Nome-da-IA> <email-fake@ia.com>' na descrição do PR para compliance SOTA."
            # Uncomment the next line to strictly enforce and fail the action
            # exit 1
          else
            echo "✅ Assinatura de Agente validada."
          fi

      - name: Acionar Linter de Segurança (PII) Local
        uses: actions/checkout@v4
      - run: |
          echo "Executando Linter SRE Local..."
          # Aqui poderíamos acoplar o script linter_pii.py que está no repo
          # ./scripts/linter_pii.py --fail-on-error
