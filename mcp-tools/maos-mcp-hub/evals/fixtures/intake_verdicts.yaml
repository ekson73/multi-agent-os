# docs/adoption/intake-batch-2026-07-01.md.
#
# Verdict vocabulary (skills/agentic-tool-intake/SKILL.md decision matrix):
#   INSTALL   — adopt the external as-is, governed
#   ADAPT     — fork / wrap / configure before adopting (adapter-first)
#   ABSORB    — absorb specific patterns/components; runtime NOT adopted
#   SUB-AGENT — route in isolation as a delegated run; never a resident layer
#   ABANDON   — reject (redundant · unsafe · lock-in · cost inverts benefit)
#   DEFER     — real candidate, no driving workload yet (anti-gold-plating)
#   EXCLUDED  — supply-chain veto (HF1) — blocked from routing entirely

