  # --- L6: generative-design studio (same slot + opposed security posture) ---
  - {a: open-design, b: open-codesign, layer: L6, reason: "same studio slot; bypassPermissions vs permissioned loop"}

  # --- L3: amplifier overkill in low-risk context ---
  - {a: ruflo, b: bmad-as-co-runtime, layer: L3, reason: "stacking two heavy meta-orchestrators (swarm runtime + persona runtime) is over-kill"}

  # --- Cross-layer second-order clashes (manager conflict propagates) ---
  - {a: base, b: carl, layer: L0/L2, reason: "base manages CLAUDE.md while carl injects per-prompt rules -> context-management overlap"}
  - {a: gstack, b: carl, layer: L2, reason: "gstack rewrites CLAUDE.md routing while carl JIT-injects domain rules -> precedence clash"}
