  - {a: ECC, b: base, layer: L0, reason: "two CLAUDE.md managers -> duplicate hooks (base /audit-claude detects sprawl)"}
  - {a: ECC, b: gstack, layer: L0, reason: "both rewrite CLAUDE.md; ECC warns 'Duplicate hooks file detected'"}

  # --- L2: always-on instruction layer (mandatory workflows collide) ---
  - {a: superpowers, b: gstack, layer: L2, reason: "competing always-on instruction layers -> unpredictable precedence (pick one)"}
  - {a: superpowers, b: ECC, layer: L2, reason: "competing always-on instruction layers -> stacked context erosion (pick one)"}
  - {a: gstack, b: ECC-browser-mcp, layer: L2, reason: "gstack bans mcp__claude-in-chrome__* that ECC bundles/expects"}

  # --- L2: hook engines (two per-prompt engines => double execution) ---
  - {a: carl, b: ECC, layer: L2, reason: "CARL hook + ECC Pre/PostToolUse stack two per-prompt hook-engines"}

  # --- L1: spec model (two spec systems => two dirs + two conventions) ---
